<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
    <h2>
        Lista de números
    </h2>

  <div id="contenedor"></div>

  <p id="resultado"></p>

<script>
    let numeros = [3, 7, 2, 9, 5, 10];
    let suma = 0;
    let ul = document.createElement("ul");
    
    for (let i = 0; i < numeros.length; i++) 
    {
        suma += numeros[i];
        let li = document.createElement("li");
        li.textContent = numeros[i];
        ul.appendChild(li);
    }
    
    document.getElementById("contenedor").appendChild(ul);
    document.getElementById("resultado").textContent = "Suma total: " + suma;
</script>
    
</body>
</html>
