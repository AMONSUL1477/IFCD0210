<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">   
    <title>Document</title>

    <style>
        html {
            font-size: 16px;
            font-family: Helvetica, sans-serif;
            background-color: #eeeeee;
        }

        * {
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #03a9f4;
            color: #eeeeee;
            padding: 16px;
            font-size: 18px;
            margin-bottom: 1rem;
            /* height: 10vh; */
            font-size: 2x;
            padding-top: 21px;
        }

        nav a {
            text-decoration: none;
            display: inline-block;
            padding: 10px;
        }
        .contenedor {
            height: auto;
            width: 55%;
            margin: 0 auto;
            padding: 20px;
            /* background-color: beige; */
        }

        .titulo {
            background-color: #81d4fa;
            margin: 0 auto;
            padding-left: 50px;
            padding-right: 50px;
            padding-top: 30px;
            box-shadow: 5px 5px 5px 5px #d1d3d3;
        }

        .cara img {
            border-radius: 75px;
        }

        .cara {
            padding: 1rem;

        }

        .izquierda {
            float: left;
        }
        .limpiar{
            clear: both;
        }
        .azul{
            background-color: #03a9f4;
            margin: 2rem;

        }
        .titular{
            padding-top: 3rem;
        }


 

        

        .circulo {
           width: 50px;
           height: 45px;
           border-radius: 50%;
           background-color: rgb(167, 167, 180);
           align-items: center; 
           overflow: hidden;
           margin-left: 5px;
 
}

         .circulo i {
           font-size: 24px;
           color: #333; 
           align-items: center;
           margin: 14px;
           margin-top: 10px;
}

        
    </style>


</head>

<body>

    <header>
        Egga Hartung
    </header>

    <div class="contenedor">
        <div class = "azul">
            <div class="cara izquierda">
                <img src="Imagenes\Egga.jpg" alt="Egga">
            </div>

            <div class="titular izquierda">

                <h1>
                    Egga 😍 Software
                </h1>
                <p>
                    Individuals and Interactions over processes and tools
                </p>
            </div>
            <div class="limpiar"></div>
        </div>

    <div class="azul">   
        
        <div class="circulo izquierda">
           <i class="fa fa-solid fa-envelope"></i>
        </div>
          
<div class="izquierda">


        
            <p>
                Mail <br>
                <a href="">mail@egga.de</a>
            </p>

            
                
            
   </div>    
   
   <div class="limpiar">

   </div>
                
            
          
        
    </div>
        
    </div>


</body>



</html>
