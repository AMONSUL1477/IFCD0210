<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
         @import url('https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap');

        *{
            margin: 0;
            padding: 0;
            font-family: Fira Mono;
        }
        html{
            font-size: 16px;            
        }
        .contenedor{
            display: flex;
            justify-content: space-evenly;
            /* space-evenly: todos a la misma distancia incluyendo margenes por defecto horizontal*/
            flex-wrap: wrap;
            /* corta las lineas */
            gap: 2rem;
            /* es como un padding es lo minimo que pueden estar juntas las tarjetas */

        }
        .tarjeta{
            background-color: rgb(210, 215, 219);
            border-radius: 8px;
            box-shadow: 0 4px 8px black;
            /* 1 arriba, 2 abajo, 3 laterales, color */
            width: 280px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            /* para que apile en columna */   
            gap: 1.5rem;
            /* separa elementos en vertical cuando encojes las pantallas*/
        }
        .tarjeta img{
            max-width: 100%;
            /* el maximo al que va a llegar la imagen */
            border-radius: 8px;
        }
        .tarjeta h3{
            font-size: 1.2rem;
            color: #333;            
        }
        .tarjeta p{
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            color: tomato;   
            font-weight: bold;  
            /* bold, es negrita */
        }
        .tarjeta button{
            padding: 10px;
            background-color: #8c8f91;
            color: #fff;
            border-radius: 5px;
            border: none;
            /* le pone borde por defecto el botón */
            cursor: pointer;
            /* aparece la mano en vez de flecha */
            transition: background-color 0.5s;         
        }
        .tarjeta button:hover{
            background-color: red;
            /* hover para hacer una transición cuando el ratón para por encima */
        }


    </style>   

</head>
<body>
    <div class="contenedor">
        <div class="tarjeta">
            <img src="https:placehold.co/300" alt="Producto">
            <h3>
                Producto 1
            </h3>
            <p>
                123.95€
            </p>
            <button>
                Comprar
            </button>
        </div>

</html>
