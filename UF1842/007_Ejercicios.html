    <script>

        function vocales(cadena)
        {  
            let contador = 0;
            for(let i = 0; i < cadena.length; i++)
            {            
                switch (cadena[i].toLocaleLowerCase())
                {
                   case 'a':
                   case 'e':
                   case 'i':
                   case 'i':
                   case 'o':
                   case 'u':
                      contador ++;
                      break;

                }

            }
            return contador;
        }

    </script>

    <script>

        function positivo(lista)
        {
            let salida = [];
            for(let i = 0; i < lista.length; i++)
            {
                if(lista[i] >= 0)
                {
                    salida.push(lista[i]);
                }               
                      
            }    
            return salida;
        }

        



    </script>
